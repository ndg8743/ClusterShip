run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gocyclo
    - gosec
    - revive

linters-settings:
  errcheck:
    check-type-assertions: true
    exclude-functions:
      - (*github.com/charmbracelet/bubbletea.Program).Send
      - (io.Closer).Close

  gocyclo:
    min-complexity: 15

  gosec:
    excludes: [G304, G115]
    severity: medium

  goimports:
    local-prefixes: clustership

  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: if-return
      - name: increment-decrement
      - name: var-declaration
      - name: range
      - name: unreachable-code

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters: [gocyclo, gosec, errcheck, gocritic]
    - path: cmd/
      linters: [gocritic]

output:
  print-linter-name: true
  sort-results: true
