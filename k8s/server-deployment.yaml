apiVersion: v1
kind: Service
metadata:
  name: clustership-server
  labels:
    app: clustership-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: clustership-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clustership-server
  labels:
    app: clustership-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clustership-server
  template:
    metadata:
      labels:
        app: clustership-server
    spec:
      containers:
      - name: server
        image: clustership-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

