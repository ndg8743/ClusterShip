# ClusterShip GPU-enabled Docker Compose
# Supports NVIDIA and AMD GPUs for benchmark mode

services:
  # NVIDIA GPU version
  clustership-nvidia:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    volumes:
      - ./templates:/app/templates:ro
      - ./models:/opt/clustership/models:rw
      - ~/.kube:/home/clustership/.kube:ro
    environment:
      - TERM=xterm-256color
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CLUSTERSHIP_GPU=true
      - CLUSTERSHIP_BENCHMARK=true
    profiles:
      - nvidia

  # AMD GPU version (ROCm)
  clustership-amd:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ./templates:/app/templates:ro
      - ./models:/opt/clustership/models:rw
      - ~/.kube:/home/clustership/.kube:ro
    environment:
      - TERM=xterm-256color
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - CLUSTERSHIP_GPU=true
      - CLUSTERSHIP_BENCHMARK=true
    profiles:
      - amd

  # CPU-only version (fallback)
  clustership-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - ./templates:/app/templates:ro
      - ~/.kube:/home/clustership/.kube:ro
    environment:
      - TERM=xterm-256color
      - CLUSTERSHIP_GPU=false
      - CLUSTERSHIP_BENCHMARK=true
    profiles:
      - cpu

  # Benchmark stress test service (for K8s deployment testing)
  stress-worker:
    image: polinux/stress-ng:0.17.04
    command:
      - "--cpu"
      - "4"
      - "--cpu-method"
      - "matrixprod"
      - "--vm"
      - "2"
      - "--vm-bytes"
      - "256M"
      - "--metrics-brief"
      - "--timeout"
      - "0"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    profiles:
      - benchmark

  # Redis benchmark service
  redis-benchmark:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    profiles:
      - benchmark

# Usage:
# NVIDIA GPU:  docker compose -f docker-compose.gpu.yml --profile nvidia up
# AMD GPU:     docker compose -f docker-compose.gpu.yml --profile amd up
# CPU only:    docker compose -f docker-compose.gpu.yml --profile cpu up
# Benchmark:   docker compose -f docker-compose.gpu.yml --profile benchmark up
