# Codecov configuration for ClusterShip
# See https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

  # Ignore paths
  ignore:
    - "**/*_test.go"
    - "**/mock*.go"
    - "cmd/**"
    - "**/*.pb.go"
    - "vendor/**"

# Comment on PR
comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true

# GitHub checks
github_checks:
  annotations: true
