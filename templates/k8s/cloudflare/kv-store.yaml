apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudflare-kv-store
  labels:
    app: clustership
    company: cloudflare
    service: kv-store
    workload-type: database
spec:
  serviceName: cloudflare-kv-store
  replicas: 2
  selector:
    matchLabels:
      company: cloudflare
      service: kv-store
  template:
    metadata:
      labels:
        app: clustership
        company: cloudflare
        service: kv-store
        workload-type: database
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5

      - name: benchmark
        image: redis:7-alpine
        command: ["sh", "-c", "sleep 30 && while true; do redis-benchmark -h localhost -p 6379 -c 10 -n 1000 -q > /dev/null 2>&1; sleep 5; done"]
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-kv-store
  labels:
    app: clustership
    company: cloudflare
    service: kv-store
spec:
  selector:
    company: cloudflare
    service: kv-store
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP
