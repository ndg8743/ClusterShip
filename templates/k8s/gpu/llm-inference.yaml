apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-llm-inference
  labels:
    app: clustership
    company: openai
    service: inference
    workload-type: gpu-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      company: openai
      service: inference
  template:
    metadata:
      labels:
        app: clustership
        company: openai
        service: inference
        workload-type: gpu-inference
    spec:
      containers:
      # LLM inference server using llama.cpp
      - name: llama
        image: ghcr.io/ggerganov/llama.cpp:server
        args:
        - "--model"
        - "/models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "--n-gpu-layers"
        - "99"
        - "--ctx-size"
        - "2048"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "2000m"
            memory: "4Gi"
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: models
          mountPath: /models
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30

      # Benchmark driver - sends continuous inference requests
      - name: benchmark
        image: curlimages/curl:8.5.0
        command:
        - sh
        - -c
        - |
          # Wait for server to be ready
          sleep 45
          while true; do
            # Send inference request
            curl -s -X POST http://localhost:8080/completion \
              -H "Content-Type: application/json" \
              -d '{"prompt": "Solve this sudoku puzzle: 5 3 . . 7 . . . . 6 . . 1 9 5 . . . . 9 8 . . . . 6 . 8 . . . 6 . . . 3 4 . . 8 . 3 . . 1 7 . . . 2 . . . 6 . 6 . . . . 2 8 . . . . 4 1 9 . . 5 . . . . 8 . . 7 9", "n_predict": 256}' \
              > /dev/null 2>&1 || true
            sleep 0.5
          done
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false

      volumes:
      - name: models
        hostPath:
          path: /opt/clustership/models
          type: DirectoryOrCreate

      nodeSelector:
        gpu: "true"

      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-llm-inference
  labels:
    app: clustership
    company: openai
    service: inference
spec:
  selector:
    company: openai
    service: inference
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
