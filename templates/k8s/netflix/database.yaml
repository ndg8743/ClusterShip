apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netflix-database
  labels:
    app: clustership
    company: netflix
    service: database
    tier: data
spec:
  serviceName: netflix-database
  replicas: 1
  selector:
    matchLabels:
      company: netflix
      service: database
  template:
    metadata:
      labels:
        app: clustership
        company: netflix
        service: database
        tier: data
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          value: "clustership"
        - name: POSTGRES_DB
          value: "netflix"
        - name: POSTGRES_USER
          value: "netflix"
        resources:
          requests:
            cpu: "400m"
            memory: "384Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - netflix
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - netflix
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-database
  labels:
    company: netflix
    service: database
spec:
  selector:
    company: netflix
    service: database
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  type: ClusterIP
  clusterIP: None
