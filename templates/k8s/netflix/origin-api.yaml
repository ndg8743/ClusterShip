apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-origin-api
  labels:
    app: clustership
    company: netflix
    service: origin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      company: netflix
      service: origin-api
  template:
    metadata:
      labels:
        company: netflix
        service: origin-api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo
        args:
        - "-text=Netflix Origin API"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
