apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-cdn-edge
  labels:
    app: clustership
    company: netflix
    service: cdn-edge
    tier: edge
    workload-type: cpu-network
spec:
  replicas: 3
  selector:
    matchLabels:
      company: netflix
      service: cdn-edge
  template:
    metadata:
      labels:
        app: clustership
        company: netflix
        service: cdn-edge
        tier: edge
        workload-type: cpu-network
    spec:
      containers:
      # Main CDN service - nginx serving cached content
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Benchmark sidecar - CPU stress for realistic load
      - name: stress
        image: polinux/stress-ng:0.17.04
        command: ["stress-ng"]
        args:
        - "--cpu"
        - "1"
        - "--cpu-method"
        - "matrixprod"
        - "--metrics-brief"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "100m"
            memory: "32Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Traffic generator for network I/O benchmark
      - name: traffic-gen
        image: curlimages/curl:8.5.0
        command:
        - sh
        - -c
        - |
          while true; do
            curl -s http://localhost:80/ > /dev/null 2>&1 || true
            curl -s http://netflix-origin-api:8080/api/content > /dev/null 2>&1 || true
            sleep 0.1
          done
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "32Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false

      volumes:
      - name: content
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-cdn-edge
  labels:
    app: clustership
    company: netflix
    service: cdn-edge
spec:
  selector:
    company: netflix
    service: cdn-edge
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
