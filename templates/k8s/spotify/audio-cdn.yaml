apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-audio-cdn
  labels:
    app: clustership
    company: spotify
    service: audio-cdn
    workload-type: network
spec:
  replicas: 4
  selector:
    matchLabels:
      company: spotify
      service: audio-cdn
  template:
    metadata:
      labels:
        app: clustership
        company: spotify
        service: audio-cdn
        workload-type: network
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5

      - name: cache
        image: redis:7-alpine
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false

      - name: traffic
        image: curlimages/curl:8.5.0
        command: ["sh", "-c", "while true; do curl -s http://localhost:80/ > /dev/null 2>&1 || true; sleep 0.1; done"]
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-audio-cdn
  labels:
    app: clustership
    company: spotify
    service: audio-cdn
spec:
  selector:
    company: spotify
    service: audio-cdn
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
