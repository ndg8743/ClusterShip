apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-ec2-api
  labels:
    app: clustership
    company: aws
    service: ec2-api
    tier: control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      company: aws
      service: ec2-api
  template:
    metadata:
      labels:
        app: clustership
        company: aws
        service: ec2-api
        tier: control-plane
    spec:
      containers:
      - name: api-server
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import time
          import uuid

          class EC2Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  # Simulate EC2 API call processing
                  result = sum(i*i for i in range(2000))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  response = {
                      'instanceId': f'i-{uuid.uuid4().hex[:8]}',
                      'status': 'running',
                      'path': self.path,
                      'compute': result
                  }
                  self.wfile.write(json.dumps(response).encode())
              def log_message(self, format, *args):
                  pass

          server = HTTPServer(('0.0.0.0', 8080), EC2Handler)
          print('EC2 API running on port 8080')
          server.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
      - name: rds-client
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          while true; do
            curl -s http://aws-rds-database:3306/ || true
            sleep 1
          done
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aws-ec2-api
  labels:
    company: aws
    service: ec2-api
spec:
  selector:
    company: aws
    service: ec2-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
