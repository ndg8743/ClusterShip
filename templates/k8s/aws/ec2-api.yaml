apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-ec2-api
  labels:
    app: clustership
    company: aws
    service: ec2-api
spec:
  replicas: 3
  selector:
    matchLabels:
      company: aws
      service: ec2-api
  template:
    metadata:
      labels:
        company: aws
        service: ec2-api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo
        args:
        - "-text=AWS EC2 API"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"
