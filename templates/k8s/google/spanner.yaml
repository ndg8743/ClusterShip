apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: google-spanner
  labels:
    app: clustership
    company: google
    service: spanner
    tier: data
spec:
  serviceName: google-spanner
  replicas: 2
  selector:
    matchLabels:
      company: google
      service: spanner
  template:
    metadata:
      labels:
        app: clustership
        company: google
        service: spanner
        tier: data
    spec:
      containers:
      # Spanner simulation using CockroachDB-style distributed SQL
      - name: spanner-node
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import random
          import time
          import uuid

          # Simulated distributed transaction state
          transactions = {}

          class SpannerHandler(BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length) if content_length else b'{}'

                  # Simulate distributed transaction
                  txn_id = str(uuid.uuid4())
                  start = time.time()

                  # Simulate Paxos/TrueTime coordination
                  time.sleep(random.uniform(0.005, 0.02))

                  transactions[txn_id] = {
                      'status': 'COMMITTED',
                      'commit_timestamp': time.time(),
                      'mutations': random.randint(1, 100)
                  }

                  latency = (time.time() - start) * 1000

                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  response = {
                      'transaction_id': txn_id,
                      'status': 'COMMITTED',
                      'commit_timestamp': transactions[txn_id]['commit_timestamp'],
                      'latency_ms': latency,
                      'replicas_confirmed': 3
                  }
                  self.wfile.write(json.dumps(response).encode())

              def do_GET(self):
                  # Simulate read with strong consistency
                  time.sleep(random.uniform(0.002, 0.01))

                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  response = {
                      'instance': 'clustership-spanner',
                      'database': 'game_data',
                      'nodes': 3,
                      'processing_units': 1000,
                      'storage_bytes': random.randint(1000000, 100000000),
                      'read_timestamp': time.time(),
                      'leader_location': 'us-central1'
                  }
                  self.wfile.write(json.dumps(response).encode())

              def log_message(self, format, *args):
                  pass

          server = HTTPServer(('0.0.0.0', 8080), SpannerHandler)
          print('Cloud Spanner on port 8080')
          server.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "300m"
            memory: "384Mi"
          limits:
            cpu: "600m"
            memory: "768Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: spanner-data
          mountPath: /data
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Distributed consensus stress (Paxos simulation)
      - name: consensus-stress
        image: polinux/stress-ng:0.17.04
        command: ["stress-ng"]
        args:
        - "--cpu"
        - "1"
        - "--cpu-method"
        - "hash"
        - "--io"
        - "1"
        - "--metrics-brief"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      volumes:
      - name: spanner-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: google-spanner
  labels:
    app: clustership
    company: google
    service: spanner
spec:
  selector:
    company: google
    service: spanner
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
  clusterIP: None
