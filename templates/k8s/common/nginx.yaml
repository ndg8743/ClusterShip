apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app: clustership
    service: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clustership
      service: nginx
  template:
    metadata:
      labels:
        app: clustership
        service: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  labels:
    app: clustership
    service: nginx
spec:
  selector:
    app: clustership
    service: nginx
  ports:
  - port: 80
    targetPort: 80
    name: http
    protocol: TCP
  type: ClusterIP
