apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app: clustership
    service: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      service: nginx
  template:
    metadata:
      labels:
        service: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"
