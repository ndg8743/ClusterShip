apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-auth
  labels:
    app: clustership
    company: steam
    service: auth
    tier: security
spec:
  replicas: 2
  selector:
    matchLabels:
      company: steam
      service: auth
  template:
    metadata:
      labels:
        app: clustership
        company: steam
        service: auth
        tier: security
    spec:
      containers:
      # Steam Guard authentication service
      - name: steam-guard
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import hashlib
          import hmac
          import time
          import secrets
          import struct

          SECRET_KEY = b'steam_guard_secret_key_clustership'

          def generate_totp():
              # Simulate TOTP generation
              counter = int(time.time()) // 30
              msg = struct.pack('>Q', counter)
              h = hmac.new(SECRET_KEY, msg, hashlib.sha1).digest()
              offset = h[-1] & 0x0F
              code = struct.unpack('>I', h[offset:offset+4])[0] & 0x7FFFFFFF
              return str(code % 1000000).zfill(6)

          class SteamGuardHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  # Simulate Steam Guard validation
                  token = hashlib.sha256(secrets.token_bytes(32)).hexdigest()
                  totp = generate_totp()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  response = {
                      'steam_id': f'7656119{secrets.token_hex(5)}',
                      'session_token': token[:32],
                      'guard_code': totp,
                      'valid': True,
                      'family_view': False
                  }
                  self.wfile.write(json.dumps(response).encode())
              def log_message(self, format, *args):
                  pass

          server = HTTPServer(('0.0.0.0', 8080), SteamGuardHandler)
          print('Steam Guard on port 8080')
          server.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Crypto stress for auth operations
      - name: crypto-stress
        image: polinux/stress-ng:0.17.04
        command: ["stress-ng"]
        args:
        - "--cpu"
        - "1"
        - "--cpu-method"
        - "hash"
        - "--metrics-brief"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "100m"
            memory: "32Mi"
          limits:
            cpu: "300m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: steam-auth
  labels:
    app: clustership
    company: steam
    service: auth
spec:
  selector:
    company: steam
    service: auth
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
