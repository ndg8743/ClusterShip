apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-workshop
  labels:
    app: clustership
    company: steam
    service: workshop
    tier: ugc
spec:
  replicas: 2
  selector:
    matchLabels:
      company: steam
      service: workshop
  template:
    metadata:
      labels:
        app: clustership
        company: steam
        service: workshop
        tier: ugc
    spec:
      containers:
      # Workshop mod hosting - nginx serving mod files
      - name: mod-server
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: mods
          mountPath: /usr/share/nginx/html
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Workshop API backend
      - name: workshop-api
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import random

          MODS = [
            {'id': 1, 'name': 'HD Texture Pack', 'downloads': 5000000},
            {'id': 2, 'name': 'Community Maps', 'downloads': 3500000},
            {'id': 3, 'name': 'Custom Skins', 'downloads': 2800000},
            {'id': 4, 'name': 'Balance Mod', 'downloads': 1200000},
          ]

          class WorkshopHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  response = {
                      'popular': MODS,
                      'recent': random.sample(MODS, 2),
                      'total_mods': 847293,
                      'total_downloads': 15000000000
                  }
                  self.wfile.write(json.dumps(response).encode())
              def log_message(self, format, *args):
                  pass

          server = HTTPServer(('0.0.0.0', 8080), WorkshopHandler)
          print('Workshop API on port 8080')
          server.serve_forever()
        ports:
        - containerPort: 8080
          name: api
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # File processing stress
      - name: file-processor
        image: polinux/stress-ng:0.17.04
        command: ["stress-ng"]
        args:
        - "--io"
        - "1"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "150m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      volumes:
      - name: mods
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: steam-workshop
  labels:
    app: clustership
    company: steam
    service: workshop
spec:
  selector:
    company: steam
    service: workshop
  ports:
  - port: 80
    targetPort: 80
    name: http
  - port: 8080
    targetPort: 8080
    name: api
  type: ClusterIP
