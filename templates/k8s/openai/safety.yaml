apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-safety
  labels:
    app: clustership
    company: openai
    service: safety
    tier: security
spec:
  replicas: 2
  selector:
    matchLabels:
      company: openai
      service: safety
  template:
    metadata:
      labels:
        app: clustership
        company: openai
        service: safety
        tier: security
    spec:
      containers:
      # Content moderation service
      - name: moderation-api
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import random
          import re

          # Simulated content categories
          CATEGORIES = [
              'hate', 'hate/threatening', 'self-harm', 'sexual', 'sexual/minors',
              'violence', 'violence/graphic', 'harassment', 'harassment/threatening'
          ]

          def moderate_content(text):
              # Simulate moderation scores
              scores = {cat: random.uniform(0, 0.1) for cat in CATEGORIES}
              flagged = any(s > 0.5 for s in scores.values())
              return scores, flagged

          class ModerationHandler(BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length) if content_length else b'{"input":"test"}'

                  try:
                      data = json.loads(body)
                      text = data.get('input', 'test')
                  except:
                      text = 'test'

                  scores, flagged = moderate_content(str(text))

                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  response = {
                      'id': f'modr-{random.randint(100000, 999999)}',
                      'model': 'text-moderation-007',
                      'results': [{
                          'flagged': flagged,
                          'categories': {cat: score > 0.5 for cat, score in scores.items()},
                          'category_scores': scores
                      }]
                  }
                  self.wfile.write(json.dumps(response).encode())

              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'operational', 'version': '007'}).encode())

              def log_message(self, format, *args):
                  pass

          server = HTTPServer(('0.0.0.0', 8080), ModerationHandler)
          print('Safety systems on port 8080')
          server.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Classification model stress
      - name: classifier-stress
        image: polinux/stress-ng:0.17.04
        command: ["stress-ng"]
        args:
        - "--cpu"
        - "1"
        - "--cpu-method"
        - "callfunc"
        - "--metrics-brief"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      # Request logging sidecar
      - name: audit-logger
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            echo "[$(date -Iseconds)] Safety check performed" >> /var/log/audit.log
            sleep 5
          done
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
        volumeMounts:
        - name: audit-logs
          mountPath: /var/log
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false

      volumes:
      - name: audit-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openai-safety
  labels:
    app: clustership
    company: openai
    service: safety
spec:
  selector:
    company: openai
    service: safety
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
