name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  game-flow:
    name: Game Flow Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go test -v -tags=integration ./tests/integration/ -run TestGameFlow -timeout=5m

  k8s:
    name: K8s Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: clustership-test
          wait: 120s
      - run: go test -v -tags=integration ./tests/integration/ -run TestK8s -timeout=15m
      - if: always()
        run: kind delete cluster --name clustership-test || true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go test -tags=integration -bench=. -benchmem -run=^$$ ./tests/integration/...
